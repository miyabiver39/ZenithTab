name: Build & Release Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
      # `npm run package` verifies dist/ and then writes the archive with a
      # dependency-free zip writer, so CI and a local Windows machine produce
      # byte-comparable packages.
      - name: Package extension
        run: npm run package
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.zip
            release/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
